<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inbox · AI Email Automation</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/mailbox.css') }}">
</head>
<body>
  <header class="mail-header">
    <a class="mail-brand" href="/" aria-label="AI Email Automation home"><span class="brand-mark">a</span><span>AI Mail<span class="brand-caption">AUTOMATION</span></span></a>
    <form id="mail-search-form" class="mail-search" role="search">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="mail-search" aria-label="Search this folder" placeholder="Search this folder" autocomplete="off">
      <button type="button" id="clear-search" aria-label="Clear search">×</button>
    </form>
    <div class="account"><span id="account-state">Connecting…</span><a href="/auth/login" id="connect-account">Connect Microsoft</a><span class="account-avatar" aria-hidden="true">A</span></div>
  </header>
  <div class="mail-layout">
    <aside class="mail-sidebar">
      <div class="sidebar-label">WORKSPACE</div>
      <nav aria-label="Mail folders">
        <button class="folder active" data-folder="inbox" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4-2 12v4h20v-4L20 4Z M2 15h6l2 3h4l2-3h6"/></svg><span>Inbox</span></button>
        <button class="folder" data-folder="outbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v5h16v-5 M12 16V3 m-5 5 5-5 5 5"/></svg><span>Outbox</span></button>
        <button class="folder" data-folder="sent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 19 9-19 9 4-9Z M7 12h15"/></svg><span>Sent</span></button>
        <button class="folder" data-folder="drafts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8Z M14 3v5h5 M8 12h8 M8 16h5"/></svg><span>Drafts</span></button>
        <button class="folder" data-folder="trash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7 M14 10v7"/></svg><span>Trash</span></button>
      </nav>
      <div class="sidebar-note"><span class="status-dot"></span> Your mail, on schedule.<small>Keep the application running for automatic sends.</small></div>
    </aside>
    <main class="mail-panel" id="mail-panel">
      <div class="folder-heading"><div><p class="eyebrow">YOUR MAILBOX</p><h1 id="folder-title">Inbox</h1></div><span id="folder-description">Incoming conversations</span></div>
      <div class="mail-toolbar">
        <input type="checkbox" id="select-messages" aria-label="Select all loaded messages">
        <button class="icon-button" id="refresh-mail" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8 M20 3v5h-5"/></svg></button>
        <button class="toolbar-button" id="delete-selected" hidden>Delete selected</button>
        <button class="toolbar-button" id="restore-selected" hidden>Restore selected</button>
        <span id="selection-count" aria-live="polite"></span>
        <span class="toolbar-spacer"></span><span id="message-count"></span>
      </div>
      <div id="mail-notice" role="status" hidden></div>
      <div id="message-list" aria-live="polite"></div>
      <div id="mail-empty" class="mail-empty" hidden><div class="empty-symbol">✉</div><h2 id="empty-title">Your inbox is clear</h2><p id="empty-description">New messages will appear here.</p></div>
      <div class="load-more"><button id="load-more" class="toolbar-button" hidden>Load more</button></div>
    </main>
  </div>
  <button id="compose-button" class="compose-button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 16 12-12 4 4L8 20H4Z M14 6l4 4"/></svg>Compose</button>
  <dialog id="compose-dialog" aria-labelledby="compose-title"><div class="dialog-top"><h2 id="compose-title">New message</h2><button id="close-compose" class="icon-button" aria-label="Close compose">×</button></div><iframe id="compose-frame" title="Compose email"></iframe></dialog>
  <dialog id="message-dialog" aria-labelledby="message-title"><div class="dialog-top"><span>Message</span><button id="close-message" class="icon-button" aria-label="Close message">×</button></div><div class="message-detail"><h2 id="message-title"></h2><div id="message-meta"></div><div id="message-schedule"></div><pre id="message-body"></pre><div id="message-results"></div></div><div id="message-actions" class="dialog-actions"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="{{ url_for('static', path='js/mailbox.js') }}?v=0.2.3"></script>
</body>
</html>
